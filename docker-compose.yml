version: '3.8'

services:
  vacancy-bot:
    build: .
    container_name: vacancy-bot
    restart: always
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./database:/app/database
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Moscow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
